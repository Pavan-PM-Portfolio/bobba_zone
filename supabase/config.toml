# Supabase CLI config. Used by `supabase link`, `supabase db push`, local dev,
# and `supabase config push` (which applies the [auth] settings below to the
# hosted project - notably anonymous sign-ins, which this app requires).
project_id = "bobba_zone"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "https://pavan-pm-portfolio.github.io/bobba_zone/"
additional_redirect_urls = ["http://localhost:5173/", "https://pavan-pm-portfolio.github.io/bobba_zone/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Guests play without an account; each browser gets a real anonymous user.
enable_anonymous_sign_ins = true

[auth.rate_limit]
# anonymous sign-ins per hour per IP
anonymous_users = 30

[auth.email]
enable_signup = true
enable_confirmations = true
