name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Tests (database security + unit)
        run: npm test
      - name: Build
        run: npx vite build
        env:
          # Supabase URL + publishable key come from the committed .env.production
          # (public values). Shell env would override it, so none are set here.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Guard against leaked secrets in the bundle
        run: |
          # real secret keys, or a JWT whose payload says role=service_role (3 base64 alignments)
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{16,}|c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG" dist; then
            echo "Privileged key material found in build output" && exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
